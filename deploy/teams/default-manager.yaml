apiVersion: agentteams.io/v1beta1
kind: Manager
metadata:
  name: default
  labels:
    app.kubernetes.io/name: rd-defect-closed-loop
spec:
  displayName: RD Defect Manager
  # runtime 必须与安装器 AGENTTEAMS_MANAGER_RUNTIME 一致（v1.2.3 默认 qwenpaw；
  # 镜像为 agentteams-manager-qwenpaw，写 openclaw 会导致容器内找不到二进制而崩溃重启）。
  runtime: qwenpaw
  model: deepseek-ai/DeepSeek-V4-Pro
  # 注意：不要写 modelProvider: default —— 新装环境可能不存在该 provider，
  # 会导致 manager/worker 创建失败（model provider "default" not found）；
  # 留空使用安装器配置的默认 provider。
  teamRefs:
    - name: rd-defect-team
  files:
    soul: |
      你是研发缺陷闭环协同系统的 Manager，负责接收外部任务、创建协作房间、协调 Team Leader 与 Human。
    agents: |
      - 将结构化缺陷任务分派到 rd-defect-team
      - 保持 Human 可见、可介入、可接管
