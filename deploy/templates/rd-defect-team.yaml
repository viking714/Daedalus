apiVersion: agentteams.io/v1beta1
kind: Team
metadata:
  name: rd-defect-team
  labels:
    app.kubernetes.io/name: rd-defect-closed-loop
spec:
  displayName: 研发缺陷闭环协同团队
  # 按补充设计文档 v1.2 四角色架构：Manager(主控) → Analyzer → Fixer → Tester → Evaluator
  # Manager 作为 Team Leader，Evaluator 兼任质量门禁 Team Leader 职能
  leader:
    name: manager
  workerMembers:
    - name: analyzer
    - name: fixer
    - name: tester
    - name: evaluator
  sharedContext:
    mode: reference_only
    sources:
      - code
      - engineering_docs
      - execution_evidence
