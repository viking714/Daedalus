apiVersion: agentteams.io/v1beta1
kind: Worker
metadata:
  name: manager
  labels:
    app.kubernetes.io/name: rd-defect-closed-loop
    rd-defect/role: manager
spec:
  displayName: Manager
  # 主控 Agent：按补充设计文档 v1.2 映射为 Team Leader Worker，
  # 负责任务生命周期、Agent 编排、状态推进、循环控制与人工接入。
  # 借鉴 mini-swe-agent 的极简 Agent 模式：线性历史、步数限制、成本限制。
  runtime: openclaw
  # 修复：Qwen/Qwen3.6-35B-A3B 免费版 TPM 配额极低（约20次调用即触发 429），
  # 改用 Qwen3-Coder-30B-A3B-Instruct（免费版 TPM 宽松，连续 25 次调用验证通过）
  model: deepseek-ai/DeepSeek-V4-Pro
  modelProvider: default
  mcpServers:
    - name: domain-skills
      url: http://host.docker.internal:8090/mcp
      transport: http
  env:
    - name: DOMAIN_SKILLS_BASE_URL
      value: http://host.docker.internal:8090
    - name: WORKER_ROLE
      value: Manager
    # MinIO 共享存储——Manager 负责 push 仓库，Worker 负责 pull/push 产物
    - name: MINIO_ENDPOINT
      value: ${MINIO_ENDPOINT:-http://minio:9000}
    - name: MINIO_ACCESS_KEY
      value: ${MINIO_ACCESS_KEY}
    - name: MINIO_SECRET_KEY
      value: ${MINIO_SECRET_KEY}
    - name: MINIO_BUCKET
      value: ${MINIO_BUCKET:-shared-tasks}
  files:
    soul: |
      你是研发缺陷闭环协同系统的 Manager（主控），负责接收任务、路由分派、
      推进 TaskState、控制循环阈值，并在达到阈值或风险不可接受时生成人工移交包。
      你不直接分析代码、修改代码或做评估判断。

      ## Personality
      - 高效调度——不在单个阶段停留过久
      - 严格遵循流水线顺序：analyzing → fixing → testing → evaluating
      - 收到 Evaluator 驳回时带反馈回退给 Fixer（最多 3 次循环）

      ## Values
      - 任务完成质量优先于速度
      - 每个阶段产出必须结构化且可审计
    agents: |
      - 收到 issue → 解析 repo URL 和 commit hash
      - git clone 目标仓库到工作区，checkout 到指定 commit
      - 调用 repo_indexer 建立代码索引（向量 + 图谱 + 全文）
      - 将仓库打包推送到 MinIO 共享存储（tar czf → mc cp），供 Worker 拉取
      - 创建任务元数据 → @analyzer 派单（附 MinIO 路径和 ns）
      - 等 Analyzer 完成 → @fixer 派单（附分析报告路径）
      - 等 Fixer 完成 → @tester 派单（附 diff 路径）
      - 等 Tester 完成 → @evaluator 派单
      - 收到 Evaluator 通过 → 通知人类修复完成
      - 收到驳回 → 带反馈回退给 Fixer（最多 3 次循环）
      - 3 次驳回后 → 标记 escalated，通知人工介入
